[package]
name = "mmcompare"
version = "0.1.0"
authors = ["Zixiang Luo <zixiangro@gmail.com>"]
edition = "2024"
rust-version = "1.96.1"
publish = false

[dependencies]
eframe = { version = "0.35", features = ["default"] }
egui_extras = { version = "0.35", features = ["default", "image"] }
env_logger = { version = "0.11.11", features = ["auto-color", "humantime"] }
image = "0.25"
jpeg-decoder = "0.3"
log = "0.4"
nom-exif = "3.6"
# 视频解码（M1 spike）：只开 codec/format/swscale，裁剪 device/filter/swresample（无音频，D5）
ffmpeg-next = { version = "9.0", default-features = false, features = ["format", "software-scaling"] }

[profile.release]
panic = "abort"
